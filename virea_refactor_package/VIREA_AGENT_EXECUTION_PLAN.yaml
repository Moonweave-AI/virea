agent_operating_protocol:
  before_edit:
    - 阅读 blueprint 对应章节、相关 ADR、现有代码和 characterization tests
    - 输出拟修改文件、公开接口、迁移风险和测试计划
    - 确认该 PR 只覆盖一个工作包或一个可独立验收的切片
  during_edit:
    - 先更新契约和样例，再实现生产代码
    - 保持旧 import/schema/route shim，除非工作包明确批准删除
    - 所有外部 revision、hash、license 写入 registry，而非散落硬编码
    - 数学和格式转换使用显式 profile，不使用模型名分支或 shape 猜测
  after_edit:
    - 执行工作包测试和受影响的全局门禁
    - 生成机器可读测试结果或日志摘要
    - 更新迁移、rollback、兼容和风险说明
    - 未达到 acceptance 时状态必须为 partial/blocked，不得标记 completed
  handoff_template:
    fields:
      - work_package
      - task_ids
      - baseline_commit
      - changed_files
      - schema_changes
      - registry_changes
      - commands_run
      - tests_passed
      - tests_failed
      - compatibility
      - migration
      - rollback
      - security_license_notes
      - unresolved_risks
      - next_slice

risk_register:
  - id: R-001
    risk: 上游动作模型依赖陈旧且相互冲突
    mitigation: pixi/uv 隔离运行时、固定 lock、fake conflict test
  - id: R-002
    risk: 不同模型输出骨架和坐标语义含糊
    mitigation: managed plugin 显式 RepresentationProfile；ambiguous import fail-closed
  - id: R-003
    risk: GPU 驱动和 PyTorch wheel 不匹配
    mitigation: MachineProfile 分层检测，runtime variant resolution 与 smoke
  - id: R-004
    risk: 非商业/受限许可阻碍分发
    mitigation: license registry、consent gate、bundle compatibility、权重不随核心发布
  - id: R-005
    risk: 旧 canonical 重定向回归
    mitigation: WP00 golden、compat bridge、旧 reader/shim、数值回归
  - id: R-006
    risk: Web 实时流导致时间轴和动作不连续
    mitigation: chunk sequence/timebase/overlap contract、backpressure 和 reconnect tests
  - id: R-007
    risk: 模型仓库中的 pickle 或任意代码造成供应链风险
    mitigation: safetensors 优先、weights_only、strict manifest、隔离 worker、签名与 SBOM
  - id: R-008
    risk: 一次性大重写使仓库长期不可用
    mitigation: brownfield 小 PR、characterization、兼容 shim、每阶段纵向可运行

final_release_acceptance:
  installation:
    - 安装后运行 virea 可进入向导或已配置控制台
    - 环境、权重和缓存无需用户手工拼接
    - 环境物理名称无碰撞且可审计
    - 多模型安装可恢复、可验证、可离线复用
  generation:
    - 至少 fake worker 与 MoMask 完整闭环
    - ModelResult、MotionIR、VrmMotionResult 版本化并持久化
    - 模型崩溃、OOM、取消均通过统一任务状态呈现
  retarget:
    - canonical211 v3 兼容回归通过
    - VRM body22/humanoid52/full55 profile 可验证
    - Viewer 不做 dataset/model-specific pose repair
    - 输出含质量、provenance、dropped/synthesized report
  security_and_license:
    - token/secret 不落日志
    - 不可信 pickle 默认拒绝
    - 所有远程 artifact 固定 revision 与 digest
    - 非商业模型不进入商业安全 bundle
    - 发布包含 SBOM、checksums 和 provenance
  platform:
    - Tier 1 全部完成真实或受控硬件验收
    - Tier 2 只声明实际验证的能力
