  - id: WP14
    title: 安全、许可与供应链硬化
    priority: P0_release_gate
    estimated_engineering_days: 8-14
    depends_on: [WP02, WP04, WP05, WP06, WP07, WP08, WP10]
    parallelizable_with: [WP09, WP11, WP12, WP13]
    goal: >-
      对下载、反序列化、插件、进程、secret、路径、许可证、哈希和发布链建立独立安全门禁。
    tasks:
      - id: WP14-T01
        action: 编写 threat model，覆盖恶意模型仓库、pickle、路径穿越、token 泄露、worker 逃逸、依赖投毒
      - id: WP14-T02
        action: 默认优先 safetensors；torch.load 使用 weights_only 和固定 allowlist；不可信 pickle fail-closed
      - id: WP14-T03
        action: 验证所有 archive extraction 路径、symlink/hardlink、压缩炸弹和磁盘配额
      - id: WP14-T04
        action: 远程 manifest 使用严格 schema，不允许任意命令、动态 Python import path 或未固定 URL
      - id: WP14-T05
        action: 实现 secret redaction、keyring/HF 标准 token 使用和日志扫描
      - id: WP14-T06
        action: 建立 SPDX license registry、bundle compatibility、NOTICE/SBOM 生成
      - id: WP14-T07
        action: 对 release artifact、manifest 和 provenance 使用 Sigstore 或等价签名方案
      - id: WP14-T08
        action: 运行依赖漏洞扫描、源码安全扫描和恶意 fixture 测试
    deliverables:
      - SECURITY.md update
      - doc/security/threat-model.md
      - packages/security/
      - registries/licenses/
      - scripts/generate_sbom.py
      - tests/security/
    tests:
      commands:
        - uv run pytest tests/security -q
        - pip-audit
        - npm audit --audit-level=high
        - scripts/check_licenses.sh
      required_cases:
        - pickle payload 拒绝
        - archive path traversal 拒绝
        - hash mismatch/quarantine
        - token 不出现在日志/diagnostic bundle
        - 非商业 bundle compatibility
        - 未签名/签名错误的发布 metadata 策略
    acceptance:
      - threat model 经评审并关联测试
      - 下载与安装有 source revision、digest、license、SBOM
      - public/remote server 模式不允许 trusted raw pickle 开关
      - release 前 security/license gate 全绿
    forbidden_changes:
      - 为兼容上游而默认 allow_pickle=True
      - 在 manifest 中接受任意 shell
      - 将非商业许可简化为普通开源许可
      - 将 secret 写入 crash report

