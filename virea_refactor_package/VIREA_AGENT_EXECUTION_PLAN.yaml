      - id: WP15-T06
        action: 更新 README、Getting Started、Model Catalog、Skeleton/IR/Plugin SDK、Troubleshooting
      - id: WP15-T07
        action: 执行从干净机器的首次运行、离线重启、多模型、崩溃隔离和 rollback 验收
      - id: WP15-T08
        action: 发布 compatibility/deprecation matrix 和 0.4 后续路线
    deliverables:
      - .github/workflows/
      - scripts/install.sh
      - scripts/install.ps1
      - doc/getting-started/
      - doc/plugin-sdk/
      - doc/model-catalog/
      - release/SBOM.*
      - release/SHA256SUMS
      - release/ACCEPTANCE_REPORT.md
    tests:
      commands:
        - scripts/ci/all.sh
        - scripts/release/verify.sh
      required_cases:
        - Ubuntu LTS NVIDIA/CPU
        - WSL2 NVIDIA manual or self-hosted gate
        - macOS Apple Silicon
        - Windows native CPU/NVIDIA support statement
        - Arch detection/support statement
        - clean install and offline second start
        - two conflicting fake models plus MoMask
        - worker crash isolation
        - legacy canonical211 playback
    acceptance:
      - 发布包可由空白用户环境按文档安装
      - checksums、SBOM、provenance 和许可清单完整
      - Tier 1 平台全部通过，Tier 2 有准确状态
      - 0.3 不宣称未实机验证的平台/模型
      - 回滚到旧 processed root/旧 reader 路径有文档和测试
    forbidden_changes:
      - 用单平台 CI 代替跨平台声明
      - 将 large-model tests 全部永久 skip
      - 发布 mutable dependency 或未固定模型 revision

