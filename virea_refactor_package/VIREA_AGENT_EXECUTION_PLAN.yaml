plan_version: virea.agent-execution-plan.v1.0.0
project:
  name: VIREA
  repository: Moonweave-AI/virea
  baseline:
    branch: main
    commit: bba6c414dd99ec632046825f43ea11e711b56afe
  blueprint: VIREA_REFACTOR_BLUEPRINT.zh-CN.md
  snapshot_date: '2026-08-20'
  target_release_line: 0.3.x

purpose: >-
  将现有 VIREA 数据适配、canonical v3、重定向、验证、服务端和 VRM Viewer
  逐步迁移为本地优先、跨平台、多模型运行时隔离、显式 Motion IR、可审计 VRM
  重定向与统一交互入口的平台。本文档供代码智能体、模型适配智能体、测试智能体和
  架构评审者共同执行。

normative_language:
  must: 必须满足，否则工作包不得合并
  must_not: 明确禁止
  should: 原则上满足，偏离时必须在 ADR 或 PR 中解释
  may: 可选能力

architecture_decisions:
  - id: AD-001
    decision: 单仓库、多包、每个模型独立不可变运行时
  - id: AD-002
    decision: 核心控制面不得依赖 PyTorch、CUDA、Transformers 或任一具体模型
  - id: AD-003
    decision: 受管理模型必须声明精确输出 schema；启发式结构检测只用于外部导入
  - id: AD-004
    decision: 现有 T×211 canonical v3 冻结为 virea.canonical211.v3 兼容配置
  - id: AD-005
    decision: 新中间层采用具名骨骼、可扩展轨道的 Motion IR v2
  - id: AD-006
    decision: 权重、运行时、结果和 bundle 使用内容寻址及完整 SHA-256
  - id: AD-007
    decision: 一键配置只修改用户态资源，不静默安装驱动或接受第三方许可
  - id: AD-008
    decision: 模型 worker 独立进程运行，控制面通过版本化协议调用
  - id: AD-009
    decision: 重定向数学在服务端/核心包完成，Viewer 不得包含数据集专用修正
  - id: AD-010
    decision: 原始数据和第三方模型视为不可信输入，读取、反序列化和路径处理 fail-closed

repository_invariants:
  - 根 pyproject.toml 不得聚合模型依赖
  - 控制面进程不得直接 import 模型插件的 torch 模块
  - current canonical v3 reader 在 0.x 重构期间必须持续可用
  - 新旧 artifact 必须通过明确版本路由，不得用 shape 猜版本
  - 模型定义、权重 artifact、runtime、installation 和 alias 必须是独立实体
  - runtime_id 必须由规范化 runtime spec 的完整 SHA-256 生成
  - 目录创建必须使用 staging、校验、原子 rename；失败状态不得标记 READY
  - Hugging Face token、私有源凭据和 worker bearer token 不得进入日志或 manifest
  - 未知骨架、单位、basis、root semantics 或许可证状态必须拒绝正式执行
  - 非商业或受限模型不得进入默认商业 bundle
  - Worker 崩溃不得使控制面、Viewer 或其他 Worker 崩溃
  - 每个模型插件必须提供 smoke fixture、schema contract 和固定 revision
  - 任何重定向变更必须给出数值回归，不得仅用截图验收

supported_platform_policy:
  tier_1:
    - ubuntu_lts_nvidia
    - ubuntu_lts_cpu
    - wsl2_nvidia
    - macos_apple_silicon
  tier_2:
    - arch_linux_nvidia
    - arch_linux_cpu
    - windows_native_nvidia
    - windows_native_cpu
    - linux_rocm
  notes:
    - Tier 1 必须进入正式发布门禁
    - Tier 2 必须准确检测并给出受支持模型矩阵，不得错误宣称可用
    - 每个具体模型可以声明比平台总体更窄的支持范围

release_bundles:
  minimal:
    purpose: 仅安装核心、Viewer、fake worker 与示例 fixture
    commercial_safe: true
  text_motion_research:
    purpose: MoMask、MDM、MotionLCM 等文本动作模型的研究 bundle
    commercial_safe: false
  avatar_research:
    purpose: SentiAvatar、EMAGE 等语音/文本驱动虚拟人研究 bundle
    commercial_safe: false
  offline_demo:
    purpose: 固定 revision、可离线演示的最小模型与样例
    commercial_safe: false

common_definition_of_done:
  required_evidence:
    - 关联的工作包 ID、issue 或 ADR
    - 变更计划和影响范围
    - schema/registry diff（如适用）
    - 测试命令、退出码和结果摘要
    - 兼容性、迁移和 rollback 说明
    - 新增下载源的固定 revision、hash 和许可证据
    - 模型变更的 runtime lock、weight digest 和 smoke 结果
    - 重定向变更的 source/target skeleton、golden 数值和质量报告
    - UI 变更的 Playwright 证据或可重复验证步骤
  merge_gates:
    - formatting
    - lint
    - typecheck
    - unit_tests
    - contract_tests
    - integration_tests
    - security_checks
    - license_checks
    - compatibility_tests
  required_commands_initial:
    - uv run ruff check .
    - uv run mypy packages apps
    - uv run pytest -q
    - npm run check
    - npm run test:viewer
  note: 命令可随工具链 ADR 调整，但 PR 必须记录实际执行命令。

artifact_identity:
  algorithms:
    digest: sha256
    manifest_canonicalization: RFC8785_or_equivalent_canonical_json
  runtime_id_formula: sha256(canonical_json(runtime_spec))
  model_artifact_id_formula: sha256(downloaded_bytes_or_merkle_manifest)
  installation_id_formula: sha256(model_definition_id + artifact_id + runtime_id + plugin_version)
  result_id_formula: sha256(canonical_result_manifest + referenced_payload_hashes)
  path_rule: 物理目录使用完整摘要；短摘要只能用于 UI 显示

state_machines:
  model_installation:
    states:
      - RESOLVING
      - AWAITING_CONSENT
      - DOWNLOADING
      - VERIFYING
      - BUILDING_RUNTIME
      - SMOKE_TESTING
      - READY
      - FAILED
      - CANCELLED
      - QUARANTINED
    terminal_states:
      - READY
      - FAILED
      - CANCELLED
      - QUARANTINED
    rule: 只有全部校验和 smoke 通过后才能进入 READY
  job:
    states:
      - QUEUED
      - ADMITTED
      - STARTING_WORKER
      - RUNNING_MODEL
      - NORMALIZING_IR
      - RETARGETING
      - VALIDATING
      - STREAMING
      - SUCCEEDED
      - FAILED
      - CANCEL_REQUESTED
      - CANCELLED
    terminal_states:
      - SUCCEEDED
      - FAILED
      - CANCELLED
  worker:
    states:
      - STOPPED
      - STARTING
      - HEALTHY
      - BUSY
      - DRAINING
      - CRASHED
      - BACKOFF

schema_targets:
  model_definition: virea.model-definition.v1.0.0
  runtime_spec: virea.runtime-spec.v1.0.0
  model_result: virea.model-result.v1.0.0
  motion_ir: virea.motion-ir.v2.0.0
  skeleton_profile: virea.skeleton-profile.v1.0.0
  representation_profile: virea.representation-profile.v1.0.0
  vrm_motion_result: virea.vrm-motion-result.v1.0.0
  worker_protocol: virea.worker-protocol.v1.0.0
  canonical_compat: virea.canonical211.v3

work_packages:
  - id: WP00
    title: 基线冻结与 Characterization
    priority: P0
    estimated_engineering_days: 4-7
    depends_on: []
    parallelizable_with: []
    goal: >-
      在改动目录和边界前冻结当前行为、schema、artifact、CLI、服务端和 Viewer 的可验证基线，
      为 brownfield migration 提供防回归证据。
    scope:
      include:
        - 当前仓库目录、依赖和入口盘点
        - canonical v3 pack/unpack、重采样与骨骼顺序
        - 七类 dataset adapter 的最小真实或脱敏 fixture
        - server preview 端点与二进制 codec
        - Viewer normalized humanoid 播放
        - artifact reader/replay/hash 行为
      exclude:
        - 新模型池实现
        - 新 UI 重写
    tasks:
      - id: WP00-T01
        action: 记录 baseline commit、Python/Node 版本、现有测试命令和已知失败
      - id: WP00-T02
        action: 为 canonical211 创建固定 golden NPZ/JSON，覆盖 identity、root motion、body、hands、重采样
      - id: WP00-T03
        action: 为每个现有 adapter 建立最小 fixture 与 discover/load contract
      - id: WP00-T04
        action: 冻结旧 CLI 命令、HTTP 路由、payload schema 和 Viewer 读取行为
      - id: WP00-T05
        action: 添加 tests/characterization/，失败测试必须标记原因而非静默跳过
      - id: WP00-T06
        action: 生成 BASELINE_REPORT.md，区分通过、已知缺陷、未验证和外部数据依赖
    deliverables:
      - tests/characterization/
      - tests/fixtures/legacy_canonical211/
      - doc/migration/BASELINE_REPORT.md
      - doc/migration/KNOWN_BEHAVIOR.md
    tests:
      commands:
        - uv run pytest tests/characterization -q
        - npm run check
        - npm run test:viewer
      required_cases:
        - canonical211 roundtrip byte/float tolerance
        - old artifact reader acceptance and tamper rejection
        - old preview API response snapshot
        - existing Viewer pose mutation count remains zero
    acceptance:
      - baseline 报告可从干净 clone 重现
      - 旧 canonical 资产有固定 golden hash
      - 已知失败有 issue/原因/预期处理，不存在无解释 xfail
      - 后续工作包可引用稳定 fixture
    forbidden_changes:
      - 删除或改名现有公开 schema
      - 大规模移动生产代码
      - 修复与 characterization 无关的功能

  - id: WP01
    title: ADR、契约与注册表骨架
    priority: P0
    estimated_engineering_days: 5-8
    depends_on: [WP00]
    parallelizable_with: [WP03]
    goal: >-
      建立新架构的版本化事实源：ADR、JSON Schema、Pydantic/TypeScript 类型生成、模型/骨架/
      表示/运行时/许可注册表及兼容策略。
    tasks:
      - id: WP01-T01
        action: 编写并接受 runtime isolation、Motion IR、content addressing、worker protocol、VRM profiles ADR
      - id: WP01-T02
        action: 新建 packages/contracts，定义 schema URI、版本规则和兼容矩阵
      - id: WP01-T03
        action: 定义 ModelDefinition、RuntimeSpec、ModelResult、MotionIR、SkeletonProfile、RepresentationProfile、VrmMotionResult
      - id: WP01-T04
        action: 建立 registries/models、skeletons、representations、licenses、runtimes、bundles
      - id: WP01-T05
        action: 生成 Python 与 TypeScript 类型，增加 schema examples 和 roundtrip tests
      - id: WP01-T06
        action: 将旧 schemas 以兼容 URI 纳入 contracts，不改变旧 reader 语义
    deliverables:
      - doc/adrs/0003-runtime-isolation.md
      - doc/adrs/0004-motion-ir-v2.md
      - doc/adrs/0005-content-addressed-model-pool.md
      - doc/adrs/0006-worker-protocol.md
      - doc/adrs/0007-vrm-skeleton-profiles.md
      - packages/contracts/
      - registries/models/
      - registries/representations/
      - registries/runtimes/
      - registries/bundles/
    tests:
      commands:
        - uv run pytest packages/contracts/tests -q
        - npm run contracts:check
      required_cases:
        - 所有 example 均通过 schema
        - 未知额外字段按各 schema 的明确策略处理
        - Python/TypeScript serialization 等价
        - schema version mismatch fail-closed
    acceptance:
      - 每个核心实体均有独立 ID 与 schema version
      - managed model 输出不依赖 tensor shape 猜测
      - canonical211 v3 有正式兼容 profile
      - VRM body22、humanoid52、full55 profile 已注册
    forbidden_changes:
      - 在 schema 中使用含糊的 any/object 代替核心字段
      - 用文件夹名充当唯一身份
      - 将上游模型版本与 VIREA plugin 版本合并为一个字段

  - id: WP02
    title: VIREA_HOME、路径与事务状态层
    priority: P0
    estimated_engineering_days: 5-8
    depends_on: [WP01]
    parallelizable_with: []
    goal: >-
      建立跨平台、无名称碰撞、可恢复、可迁移的本地状态目录和 SQLite 元数据层。
    tasks:
      - id: WP02-T01
        action: 使用 platformdirs/XDG 规则实现 VIREA_HOME，支持显式 VIREA_HOME 覆盖
      - id: WP02-T02
        action: 实现 artifacts、runtimes、installations、results、cache、logs、tmp、locks 目录规范
      - id: WP02-T03
        action: 建立 SQLite WAL 数据库与 migration framework
      - id: WP02-T04
        action: 实现 staging、fsync、hash verification、atomic rename 和 crash recovery
      - id: WP02-T05
        action: 实现跨进程文件锁、安装租约和 stale staging 清理
      - id: WP02-T06
        action: 实现旧 configs/project.yaml 与 VIREA_* 数据路径的只读迁移/导入器
      - id: WP02-T07
        action: 提供 virea state inspect、migrate、gc --dry-run
    deliverables:
      - packages/state/
      - packages/core/virea_core/paths.py
      - packages/core/virea_core/db/
      - apps/cli/commands/state.py
      - tests/integration/test_atomic_installation.py
    tests:
      commands:
        - uv run pytest packages/state tests/integration/test_atomic_installation.py -q
      required_cases:
        - 两个同名不同内容模型不冲突
        - 相同 runtime spec 去重
        - 中断下载/构建不出现 READY
        - Windows 长路径与文件锁测试
        - WAL 并发读写和进程崩溃恢复
    acceptance:
      - 所有物理目录由完整 digest 标识
      - alias 改名不移动底层 artifact
      - state DB 可重建索引但不丢失内容寻址对象
      - gc 在 dry-run 中说明引用链和预计释放空间
    forbidden_changes:
      - 使用 model_name 作为运行时目录名
      - 使用短 hash 作为物理身份
      - 在事务提交前更新 READY 状态

  - id: WP03
    title: 机器检测、Bootstrap 与 Doctor
    priority: P0
    estimated_engineering_days: 6-10
    depends_on: [WP01]
    parallelizable_with: [WP02, WP07]
    goal: >-
      对 Ubuntu、Arch、macOS、Windows 和 WSL2 建立事实化能力检测，输出机器能力而非替用户猜测安装方案。
    tasks:
      - id: WP03-T01
        action: 定义 MachineProfile schema，覆盖 OS、distro、kernel、arch、WSL、CPU、RAM、swap、disk
      - id: WP03-T02
        action: 检测 NVIDIA driver/runtime/VRAM、ROCm、Apple Metal/MPS、CPU 指令集
      - id: WP03-T03
        action: 区分 hardware_present、driver_available、framework_usable、model_supported 四层状态
      - id: WP03-T04
        action: 实现 virea doctor --json、--explain、--repair-plan
      - id: WP03-T05
        action: 实现 bootstrap 安装计划，不静默执行 root/admin 操作
      - id: WP03-T06
        action: 集成 HF auth 状态检测，但 token 仅来自 keyring、HF 标准存储或环境变量
      - id: WP03-T07
        action: 根据 model manifest 生成 variant compatibility 与资源提示
    deliverables:
      - packages/bootstrap/
      - packages/hardware/
      - schemas/machine-profile.schema.json
      - apps/cli/commands/doctor.py
      - tests/platform/
    tests:
      commands:
        - uv run pytest packages/hardware tests/platform -q
      required_cases:
        - Ubuntu NVIDIA
        - WSL2 NVIDIA
        - Arch 无 GPU
        - macOS Apple Silicon
        - Windows native CPU/NVIDIA
        - 存在 GPU 但 driver 不可用
        - 磁盘或内存不足
    acceptance:
      - 检测结果可序列化、可缓存、可解释
      - 不把 WSL2 错识别为普通 Linux
      - 不根据 nvidia-smi 存在就宣称 PyTorch CUDA 可用
      - repair plan 区分自动、需要确认、需要管理员和人工步骤
    forbidden_changes:
      - 静默安装/升级显卡驱动
      - 在探测代码中下载大型模型
      - 把平台字符串直接当模型兼容结论

  - id: WP04
    title: 隔离运行时后端
    priority: P0
    estimated_engineering_days: 10-16
    depends_on: [WP02, WP03]
    parallelizable_with: [WP05, WP08]
    goal: >-
      实现 uv-native 与 pixi-native 后端，按 RuntimeSpec 构建不可变、可验证、可复用的模型环境。
    tasks:
      - id: WP04-T01
        action: 定义 RuntimeBackend 接口：resolve、plan、build、verify、run、remove、diagnose
      - id: WP04-T02
        action: 实现 uv-native，使用固定 Python、lockfile、index 与 wheel hash
      - id: WP04-T03
        action: 实现 pixi-native，支持旧 PyTorch、Conda CUDA 和原生依赖
      - id: WP04-T04
        action: 运行时 ID 由 canonical RuntimeSpec 计算，不含机器临时路径
      - id: WP04-T05
        action: 将 platform/accelerator variant 选择与 runtime spec 分离并记录解析证据
      - id: WP04-T06
        action: 实现 build staging、日志、超时、取消、校验和 smoke command
      - id: WP04-T07
        action: 实现 runtime dedup、引用计数、quarantine 和诊断包
      - id: WP04-T08
        action: 预留 OCI backend interface，但不阻塞 P0
    deliverables:
      - packages/runtime/
      - packages/runtime/backends/uv_native.py
      - packages/runtime/backends/pixi_native.py
      - schemas/runtime-spec.schema.json
      - tests/runtime/
    tests:
      commands:
        - uv run pytest packages/runtime tests/runtime -q
      required_cases:
        - 两个依赖冲突的 fake model 可同时安装和运行
        - 相同 runtime spec 跨模型复用
        - lock 或 artifact hash 改变会生成新 runtime_id
        - 构建取消与失败回滚
        - 无网络的已构建运行时可再次启动
    acceptance:
      - 核心环境 pip list 不包含模型专用依赖
      - runtime manifest 记录 Python、包、平台、后端、lock digest
      - worker 只能从对应 runtime 启动
      - 运行时验证失败进入 QUARANTINED 或 FAILED
    forbidden_changes:
      - conda env 名称作为唯一标识
      - 共享可变 site-packages
      - 自动降级到未声明的 Python/PyTorch 版本

  - id: WP05
    title: 模型池、Artifact Store 与安装事务
    priority: P0
    estimated_engineering_days: 8-13
    depends_on: [WP02, WP03]
    parallelizable_with: [WP04, WP07, WP08]
    goal: >-
      实现模型选择、多选安装、固定 revision 下载、验证、许可门禁、安装状态机和离线复用。
    tasks:
      - id: WP05-T01
        action: 实现 ModelCatalog、ModelResolver、ArtifactStore、InstallationService
      - id: WP05-T02
        action: 支持 Hugging Face snapshot、GitHub Release、HTTPS 和本地路径 source
      - id: WP05-T03
        action: 所有远程源固定 revision/commit/tag，并验证文件大小、SHA-256、allow/ignore patterns
      - id: WP05-T04
        action: 实现许可证、gated repo、SMPL/数据集前置条件与 AWAITING_CONSENT
      - id: WP05-T05
        action: 实现多模型安装计划、共享 artifact/runtime 去重、并发下载和断点恢复
      - id: WP05-T06
        action: 实现 list、info、install、remove、verify、repair、gc、bundle 命令
      - id: WP05-T07
        action: 建立 fake models 作为 deterministic contract fixtures
      - id: WP05-T08
        action: 禁止 manifest 任意 shell；仅允许受控 entrypoint 和参数模板
    deliverables:
      - packages/model_pool/
      - registries/models/fake-motion.yaml
      - registries/bundles/minimal.yaml
      - apps/cli/commands/model.py
      - tests/model_pool/
    tests:
      commands:
        - uv run pytest packages/model_pool tests/model_pool -q
      required_cases:
        - 一次选择多个模型并正确汇总空间、许可和 runtime
        - gated HF source 缺 token 时进入等待而非失败堆栈
        - 下载内容被篡改时拒绝安装
        - 断点续传后 hash 一致
        - 删除 alias 不误删共享 artifact
    acceptance:
      - READY installation 可在离线状态验证和启动
      - 每个安装可追溯到 model definition、artifact、runtime 和 plugin version
      - 安装计划明确显示下载量、磁盘量、平台 variant 和许可
      - 非商业模型不会进入 commercial-safe bundle
    forbidden_changes:
      - 跟随 mutable latest/main 而不固定 revision
      - 将 token 写入数据库或安装 manifest
      - 直接执行远程 manifest 提供的 shell 字符串

  - id: WP06
    title: Worker SDK、进程监督与协议
    priority: P0
    estimated_engineering_days: 8-12
    depends_on: [WP04, WP05, WP01]
    parallelizable_with: [WP07, WP08]
    goal: >-
      建立模型进程隔离、健康检查、元数据、推理、取消、流式事件和故障恢复的稳定协议。
    tasks:
      - id: WP06-T01
        action: 定义 KServe V2 风格 health/metadata/infer 子集与 VIREA async/stream 扩展
      - id: WP06-T02
        action: 建立 Python Worker SDK，插件只实现 load、infer、unload、capabilities
      - id: WP06-T03
        action: 实现 Supervisor，以 loopback 随机端口和一次性 bearer token 启动 worker
      - id: WP06-T04
        action: 实现 stdout/stderr capture、结构化日志、心跳、启动超时、backoff、drain
      - id: WP06-T05
        action: 实现单 worker 资源声明、GPU admission、并发上限和显存 OOM 分类
      - id: WP06-T06
        action: 实现 fake deterministic、fake streaming、fake crash、fake OOM workers
      - id: WP06-T07
        action: 协议版本不匹配必须拒绝，不得隐式兼容
    deliverables:
      - packages/worker_sdk/
      - packages/supervisor/
      - schemas/worker-protocol.schema.json
      - plugins/fake_*/
      - tests/worker_protocol/
    tests:
      commands:
        - uv run pytest packages/worker_sdk packages/supervisor tests/worker_protocol -q
      required_cases:
        - 启动、健康、推理、流式、取消、卸载
        - worker crash 后控制面保持健康
        - bearer token 错误拒绝访问
        - 协议版本不匹配
        - OOM 与普通模型错误区分
    acceptance:
      - 控制面不 import worker 模型代码
      - worker 只能绑定 loopback，除非显式远程部署模式
      - 日志包含 installation/job correlation id 且不含 secret
      - fake workers 可支撑 API 和 UI 并行开发
    forbidden_changes:
      - 通过 Python multiprocessing 共享控制面解释器和模型对象
      - worker 监听 0.0.0.0 作为默认值
      - 无限重启崩溃模型

