schema_version: virea.adapter_family.v1.0.0
id: mardm-ric67-body22
display_name: MARDM HumanML3D RIC-67 to body-22 positions
source_models:
  - mardm-humanml3d
implementation_status: production_adapter_real_checkpoint_validated
support_status: integrated_experimental
native_profile:
  representation_id: mardm.humanml3d.ric67.v1
  carrier: dense_float_tensor
  shape: [T, 67]
  dtype: float32
  fps:
    mode: fixed
    value: 20.0
  coordinate_system:
    id: humanml3d.right_handed_y_up_z_forward
    handedness: right
    up_axis: positive_y
    nominal_forward_axis: positive_z
  units:
    positions_and_velocities: meters_and_meters_per_frame_in_the_official_feature_convention
  fields:
    - name: root_yaw_angular_velocity
      slice: [0, 1]
      width: 1
    - name: root_facing_local_xz_velocity
      slice: [1, 3]
      width: 2
    - name: absolute_root_height_y
      slice: [3, 4]
      width: 1
    - name: relative_joint_coordinates
      slice: [4, 67]
      shape: [T, 21, 3]
      semantics: non_root_joint_positions_in_root_facing_frame
root_semantics:
  translation:
    kind: relative_velocity_plus_absolute_height
    initial_xz: [0.0, 0.0]
    required_algorithm: MARDM_utils_motion_process_recover_root_rot_pos_then_recover_from_ric
  rotation:
    kind: recovered_yaw_only
    initial_rotation: identity
    required_algorithm: MARDM_utils_motion_process_recover_root_rot_pos
output_profile:
  representation_id: humanml3d.body22.positions.v1
  skeleton_id: humanml3d.body22.v1
  shape: [T, 22, 3]
  fps: 20.0
  coordinate_system: humanml3d.right_handed_y_up_z_forward
  units: meters
  authoritative_geometry: recovered_joint_positions
  per_joint_rotation_provenance: unavailable_except_recovered_root_yaw
conversion:
  required_steps:
    - denormalize_with_MARDM_checkpoint_mean_and_std
    - call_the_pinned_upstream_root_recovery
    - call_the_pinned_upstream_RIC_recovery_for_22_joints
    - retain_the_67D_source_and_checkpoint_provenance
  prohibited_shortcuts:
    - invent_per_joint_rotations
    - treat_root_velocity_as_world_space
validation:
  exact_feature_width: 67
  reject_non_finite: true
  require_fps: 20.0
  require_checkpoint_specific_mean_std: true
official_sources:
  - repository: https://github.com/neu-vi/MARDM
    revision: 5e32b69723376028f38125ccee33011549cd341d
    path: utils/motion_process.py
  - repository: https://github.com/neu-vi/MARDM
    revision: 5e32b69723376028f38125ccee33011549cd341d
    path: sample.py
notes:
  - MARDM's public HumanML3D decoder generates only the 67 features needed for positional RIC recovery; this family is intentionally separate from the full 263D family.
  - The VIREA compatibility adapter applies identified checkpoint statistics, preserves normalized and denormalized 67D artifacts, and uses the official RIC recovery equations with deterministic contract coverage; the integrated MARDM model records real Worker production acceptance separately.
