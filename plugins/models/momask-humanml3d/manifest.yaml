    representation_id: humanml3d.vector263.v1
    skeleton_id: humanml3d.body22.v1
    min_frames: 80
    artifacts: [native_motion, motion_ir, retargeted_motion, vrma]
  required_stages: [environment_detection, artifact_installation, runtime_build, model_load, inference, native_artifact_validation, motion_ir_conversion, retarget_validation, vrma_export, web_playback]
  timeout_seconds: 3600.0
notes:
  - The Worker executes the released MaskTransformer, ResidualTransformer, and RVQVAE graph from the pinned source commit and checkpoints; it never substitutes synthetic motion.
  - The native NPY is inverse-normalized finite float32 [T,263]. HumanML3D recovery remains an explicit downstream adapter step; the 263D vector is not mislabeled as local joint rotations.
  - The Google Drive archive is a manual external-root artifact because upstream provides no immutable HTTPS object digest or separate weight license. Its only accepted root file is humanml3d_models.zip; recursive wildcard acceptance is intentionally forbidden.
  - integrated_experimental records an implemented locked runtime contract, not completed cross-platform production evidence. Every published installation must still pass the complete production acceptance contract above.
