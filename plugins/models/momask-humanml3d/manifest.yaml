schema_version: virea.model_plugin.v1.0.0
model:
  id: momask-humanml3d
  display_name: MoMask HumanML3D
  plugin_version: 0.1.0
  upstream:
    repository: https://github.com/EricGuo5513/momask-codes
    revision: 94a6636c9c463b7a9414c3401a6f1b67e6c51824
    release: CVPR 2024; models released 2023-12-15
  tasks:
    - text_to_motion
    - text_guided_motion_editing
  adapter_family: humanml3d-motion263-body22
  status: runnable_upstream
inputs:
  - schema_version: virea.job_request.v1.0.0
    task: text_to_motion
    fields:
      prompt:
        type: string
        required: true
      motion_length_frames:
        type: integer
        description: Optional HumanML3D pose count; upstream rounds to a multiple of four.
  - schema_version: virea.job_request.v1.0.0
    task: text_guided_motion_editing
    fields:
      prompt:
        type: string
        required: true
      source_motion:
        representation_id: humanml3d.vector263.v1
        required: true
      edit_interval:
        type: normalized_half_open_interval
        required: true
output:
  envelope: virea.model_result.v1.0.0
  representation_id: humanml3d.vector263.v1
  skeleton_id: humanml3d.body22.v1
  fps: 20.0
  coordinate_system: humanml3d.right_handed_y_up_z_forward
  units: meters
  root_translation_semantics: relative_root_facing_xz_velocity_integrated_from_origin_with_absolute_y_height
  root_rotation_semantics: yaw_integrated_from_relative_angular_velocity_with_initial_identity
  face_representation_ids: []
runtime_variants: []
artifacts:
  - id: momask-pretrained-models-and-evaluators
    kind: manual
    url: https://drive.google.com/drive/folders/1sHajltuE2xgHh91H9pFpMAYAkHaX9o57
    expected_files:
      - checkpoints/t2m/**
      - checkpoints/kit/**
licenses:
  code: MIT
  weights: upstream_does_not_state_a_separate_weight_license
  dataset_lineage:
    - HumanML3D
    - AMASS
  body_model:
    - SMPL/SMPL-X are optional rendering dependencies and retain their own licenses
  commercial_allowed: null
  redistribution_allowed: null
  requires_acceptance: false
  source_urls:
    - https://github.com/EricGuo5513/momask-codes/blob/94a6636c9c463b7a9414c3401a6f1b67e6c51824/LICENSE
    - https://github.com/EricGuo5513/momask-codes/blob/94a6636c9c463b7a9414c3401a6f1b67e6c51824/README.md
resources:
  upstream_tested_python: 3.7.13
  upstream_tested_pytorch: 1.7.1
  upstream_alternative_python: "3.10"
  upstream_inference_entrypoint: gen_t2m.py
  upstream_gpu: optional_for_web_demo
  output_export:
    joints_shape: [T, 22, 3]
    formats: [npy, bvh, mp4]
notes:
  - The full upstream Git commit was verified with git ls-remote on 2026-08-21.
  - runnable_upstream means the official repository and checkpoints are usable upstream; no VIREA Worker, isolated lock, real artifact installation, or production end-to-end acceptance has been completed.
  - The declared 263D representation must be decoded through the HumanML3D recovery algorithm; its 126D child-edge rotation block is not a direct glTF node-local rotation stream.
