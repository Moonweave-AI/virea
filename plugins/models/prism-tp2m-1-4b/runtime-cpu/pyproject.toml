[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-prism-tp2m-1-4b-cpu-runtime"
version = "0.1.6"
description = "Portable CPU environment for the shared VIREA PRISM Worker"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Moonweave AI" }]
dependencies = [
  "virea-model-prism-tp2m-1-4b-runtime==0.1.6",
  "numpy==1.26.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch==2.11.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
virea-model-prism-tp2m-1-4b-cpu-worker = "virea_prism.worker:main"

[tool.uv.sources]
virea-model-prism-tp2m-1-4b-runtime = { path = "../runtime", editable = false }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
