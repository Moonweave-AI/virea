notes:
  - The managed WSL2 production-evidence chain remains historical evidence for runtime package 0.1.2. The new 0.1.3 CUDA wrapper and CPU runtime have contract/lock evidence only and require separate real-checkpoint acceptance.
  - The Worker performs no model download or implicit Hub access. Every artifact is installed before startup and addressed by VIREA_ARTIFACT_ROOTS_JSON.
  - The runtime does not require or fabricate SMPL-X geometry. The raw public SMPL-X-style NPZ is preserved alongside the exact 69D body22 control-plane carrier.
  - PRISM source and model assets remain external-only until usable redistribution terms are published.
  - The CPU runtime uses all components on CPU in float32 and fails closed before artifact loading unless 96 GiB is available. This is a conservative unmeasured floor, not evidence that real CPU inference has passed.
