[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-prism-tp2m-1-4b-runtime"
version = "0.1.4"
description = "Offline component-split PRISM TP2M 1.4B Worker for VIREA"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Moonweave AI" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "virea-contracts>=0.4.0",
  "virea-model-sdk>=0.4.0",
  "torch>=2.2.2,<2.12",
  "transformers==4.57.6",
  "diffusers==0.39.0",
  "accelerate==1.14.0",
  "einops==0.8.2",
  "safetensors==0.8.0",
  "scipy==1.17.1",
  "smplx==0.1.28",
  "mmengine==0.10.7",
  "sentencepiece==0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]

[project.scripts]
virea-model-prism-tp2m-worker = "virea_prism.worker:main"

[tool.uv.sources]
virea-contracts = { path = "../../../../packages/contracts", editable = true }
virea-model-sdk = { path = "../../../../packages/model_sdk", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
