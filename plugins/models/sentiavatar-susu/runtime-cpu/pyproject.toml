[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-sentiavatar-susu-cpu-runtime"
version = "0.2.0"
description = "Portable CPU environment for the SentiAvatar SuSu VIREA Worker"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Moonweave AI" }]
dependencies = [
  "virea-model-sentiavatar-susu-runtime==0.2.0",
  "torch==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
virea-model-sentiavatar-susu-cpu-worker = "virea_sentiavatar.worker:main"

[tool.uv.sources]
virea-model-sentiavatar-susu-runtime = { path = "../runtime", editable = false }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
