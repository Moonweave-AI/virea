inputs:
  - schema_version: virea.job_request.v1.0.0
    task: audio_text_to_avatar_motion
    fields:
      audio:
        type: mono_pcm_audio
        sample_rate_hz: 16000
        required: true
        accepted_values: [browser_audio_data_uri, server_local_path, artifact_uri]
      dialogue_text:
        type: string
        required: true
        maximum_length: 8000
      action_and_expression_tags:
        type: string
        required: false
        default: 动作：说话
        maximum_length: 8000
      seed: {type: integer, default: 3407, minimum: 0, maximum: 2147483583}
      temperature: {type: number, default: 0.2, minimum: 0.05, maximum: 2.0}
      top_p: {type: number, default: 0.2, minimum: 0.05, maximum: 1.0}
      generate_steps: {type: integer, default: 6, minimum: 1, maximum: 24}
      planner_max_new_tokens: {type: integer, default: 1024, minimum: 64, maximum: 1024}
      generate_face: {type: boolean, default: true}
  - schema_version: virea.job_request.v1.0.0
    task: streaming_dialogue_avatar_motion
    fields:
      audio_chunks:
        type: mono_pcm_audio_stream
        sample_rate_hz: 16000
        required: true
        minimum_items: 1
        maximum_items: 64
      dialogue_turns:
        type: text_stream
        required: true
        minimum_items: 1
        maximum_items: 64
      seed: {type: integer, default: 3407, minimum: 0, maximum: 2147483583}
      temperature: {type: number, default: 0.2, minimum: 0.05, maximum: 2.0}
      top_p: {type: number, default: 0.2, minimum: 0.05, maximum: 1.0}
      generate_steps: {type: integer, default: 6, minimum: 1, maximum: 24}
      planner_max_new_tokens: {type: integer, default: 1024, minimum: 64, maximum: 1024}
      generate_face: {type: boolean, default: true}
