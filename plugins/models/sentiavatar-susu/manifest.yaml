notes:
  - The full Git commit and Hugging Face artifact revision were verified with git ls-remote on 2026-08-21.
  - The Worker loads every model from exact VIREA-managed artifact roots with Hugging Face and Transformers offline modes enabled; it never launches or contacts a residual vLLM service.
  - The upstream single-case path generates body motion and uses the released Daiji_A_001_V001.npy stream for both hands. VIREA preserves that official behavior, identifies it in generation_metadata, and does not mislabel the hands as newly generated.
  - Face ARKit51 output is produced by the released Face VQ-VAE and Chinese HuBERT path when generate_face is true. It remains optional in the native adapter contract.
  - The 25+20+20 stream count becomes the official 63-joint MTA skeleton because each hand stream repeats the corresponding body wrist; the adapter drops only those two duplicates.
  - integrated_experimental records a complete pinned runtime implementation. READY still requires real local checkpoint acceptance, conversion, retargeting, VRMA export, and browser playback on the selected device.
