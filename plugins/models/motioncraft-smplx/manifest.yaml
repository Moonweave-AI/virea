notes:
  - The Worker executes the three released STMoGen/ControlNet graphs and their exact checkpoints; no task substitutes synthetic or generic motion.
  - The task-specific mean/std vectors are pinned in the source commit and emitted as finite float32 NPY files beside normalized [T,322] output, so downstream conversion cannot silently use the wrong dataset statistics.
  - The official FineDance/AIST++ 35D librosa feature algorithm is applied to local music; speech is decoded to the official mono 16 kHz waveform carrier.
  - MotionDiffusion instantiated a CUDA/PyTorch3D visualization skeleton that inference never reads. The Worker removes only that unused constructor and uses a state-dict-compatible pure Torch implementation of Tutel's single-process top-k MoE equations on every OS.
  - CLIP is loaded only from the supervisor-installed ViT-B/32 file. HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE are forced, and all implicit network access is forbidden.
  - integrated_experimental records a complete implemented and locked runtime contract. READY is still published only after the selected local device passes the full production acceptance path above.
