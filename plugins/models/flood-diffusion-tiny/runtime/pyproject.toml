[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-flood-diffusion-tiny-runtime"
version = "0.1.3"
description = "Managed FloodDiffusionTiny Worker for the VIREA model plugin"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Moonweave AI" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "virea-contracts>=0.4.0",
  "virea-model-sdk>=0.4.0",
  "torch>=2.2.2,<2.12",
  "transformers>=4.51,<5",
  "huggingface-hub>=0.30,<2",
  "lightning>=2.3,<3",
  "diffusers>=0.31,<1",
  "omegaconf>=2.3,<3",
  "ftfy>=6.2,<7",
  "safetensors>=0.4,<1",
  "einops>=0.8,<1",
  "sentencepiece>=0.2,<1",
  "protobuf>=5,<7",
  "scipy>=1.13,<2",
  "easydict>=1.13,<2",
  "torch-ema>=0.3,<1",
  "torchmetrics>=1.4,<2",
]

[project.optional-dependencies]
model = []
dev = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",
]

[project.scripts]
virea-model-flood-diffusion-tiny-worker = "virea_flood.worker:main"

[tool.uv.sources]
virea-contracts = { path = "../../../../packages/contracts", editable = true }
virea-model-sdk = { path = "../../../../packages/model_sdk", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
