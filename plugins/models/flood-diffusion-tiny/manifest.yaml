production_acceptance:
  schema_version: virea.production_e2e_acceptance.v1.0.0
  kind: production_e2e
  request:
    schema_version: virea.job_request.v1.0.0
    model_id: flood-diffusion-tiny
    task: text_to_motion
    input:
      prompt: A person walks forward, turns left, and waves with the right hand.
    parameters:
      seconds: 4.0
      seed: 42
      fps: 20.0
    avatar_id: null
    idempotency_key: null
  expected:
    representation_id: humanml3d.vector263.v1
    skeleton_id: humanml3d.body22.v1
    min_frames: 40
    artifacts:
      - native_motion
      - motion_ir
      - retargeted_motion
      - vrma
  required_stages:
    - environment_detection
    - artifact_installation
    - runtime_build
    - model_load
    - inference
    - native_artifact_validation
    - motion_ir_conversion
    - retarget_validation
    - vrma_export
    - web_playback
  timeout_seconds: 1800.0
notes:
  - The Worker has no behavior-switch or generated fixture path; it fails closed unless both explicit model roots are physical snapshots attributed to their pinned Hugging Face revisions. CUDA is required only by cuda_full; whole-model CPU forces float32 and PyTorch SDPA.
  - Worker readiness is offline-only. The upstream google/umt5-base reference is redirected to VIREA_TEXT_ENCODER_ROOT with local_files_only while loading.
  - The google/umt5-base text encoder is a separate Apache-2.0 artifact pinned to the official Hugging Face safetensors conversion commit 3d0f0ce00e52a86f64385e1b5d0660999c5f96da; installation is restricted to the six declared runtime files and excludes pickle, Flax, and TensorFlow weights.
  - integrated_experimental requires the declared production E2E path and its persisted installation, job, artifact, and browser-playback evidence; the manifest declaration alone is not release evidence.
  - "The CPU runtime has no known artifact-format blocker: the exact UMT5 safetensors conversion commit avoids the Transformers pickle safety gate on Intel macOS. Real CPU load and inference remain unverified on every platform."
  - The official callable returns a whole sequence rather than a frame-streaming API. VIREA checks cancellation boundaries and force-stops only that isolated Worker process tree when cancellation must preempt the GPU call.
