  min_vram_gib: 16
  resource_requirement_basis: official_model_card_recommends_16GB_vram_and_16GB_system_ram
  native_feature_dim: 263
  native_fps: 20.0
  implementation: plugins/models/flood-diffusion-tiny/runtime/src/virea_flood/worker.py
