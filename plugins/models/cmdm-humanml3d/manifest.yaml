notes:
  - "The Worker executes the pinned CMDM release path: DistilBERT text encoding, causal flow generation with the released pyramid schedule, MAC-VAE decoding, then the official HumanML3D inverse normalization."
  - "The sole [T,263] native motion artifact is post inverse-normalization and therefore directly satisfies the existing HumanML3D adapter. The normalized decoder tensor is not duplicated as a second [T,263] artifact because the control plane intentionally requires exactly one native carrier."
  - "CUDA full placement and whole-model CPU execution are implemented. No CUDA-to-CPU layer offload or sequential offload strategy is advertised."
  - "The official single-prompt generate method has an unbound-local defect at cfg exactly 1.0. The Worker fails that value explicitly instead of silently changing its mathematics."
  - "The official Hugging Face model card names Apache-2.0 but its LICENSE hyperlink does not resolve to a file at the pinned revision; deployments needing a complete copied license text must resolve that packaging omission with LY Corporation."
  - "The official GitHub README describes the repository as a temporary open-source release that may later become read-only or private; production mirroring is a release-operations decision, not something this Worker silently performs."
  - "Only the released single-prompt text-to-motion path is declared here. Multi-prompt autoregressive chaining requires a separate request/segment contract and production acceptance."
  - "The pinned artifacts passed VIREA environment detection, transactional installation, isolated CUDA runtime load, exact 80-frame inference, native validation, Motion IR conversion, retarget validation, and VRMA export on Windows with an RTX 5090 Laptop GPU. Independent strict validation passed for job 01M0H3DRQ71SYSHVHJAE7MDGHZ and result 01M0H3E9P1RKRT9TBX5DFJMV9X; real browser playback remains separate release evidence, so this is integrated_experimental rather than a supported or cross-platform claim."
