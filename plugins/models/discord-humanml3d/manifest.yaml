production_acceptance:
  schema_version: virea.production_e2e_acceptance.v1.0.0
  kind: production_e2e
  request:
    schema_version: virea.job_request.v1.0.0
    model_id: discord-humanml3d
    task: text_to_motion
    input: {prompt: "A person walks forward, turns left, and waves with the right hand."}
    parameters: {motion_length_frames: 80, seed: 24, time_steps: 10, rf_steps: 16, fps: 20.0}
    avatar_id: null
    idempotency_key: null
  expected:
    representation_id: humanml3d.vector263.v1
    skeleton_id: humanml3d.body22.v1
    min_frames: 80
    artifacts: [native_motion, motion_ir, retargeted_motion, vrma]
  required_stages: [environment_detection, artifact_installation, runtime_build, model_load, inference, native_artifact_validation, motion_ir_conversion, retarget_validation, vrma_export, web_playback]
  timeout_seconds: 3600.0
notes:
  - The Worker runs the official MoMask mask/residual token graph and feeds its released RVQ code embeddings into the official DisCoRD rectified-flow decoder. It does not fall back to MoMask motion or synthetic output.
  - The native artifact is inverse-normalized finite float32 [T,263]. The HumanML3D adapter performs recovery downstream and never interprets the 263D child-edge block as direct glTF local rotations.
  - Both Google Drive files are precise manual external-root requirements because the upstream RF file currently cannot be fetched anonymously and neither weight bundle has a separately stated license. Wildcard expected_files are forbidden.
  - The CPU graph contains no .cuda() inference call; training-only CUDA modules are excluded. integrated_experimental still requires real-checkpoint acceptance on every published platform/runtime wrapper.
