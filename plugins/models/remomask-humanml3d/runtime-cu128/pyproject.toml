[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-remomask-humanml3d-cu128-runtime"
version = "0.2.0"
description = "CUDA 12.8 environment for the shared VIREA ReMoMask Worker"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "CC-BY-NC-SA-4.0" }
dependencies = [
  "virea-model-remomask-humanml3d-runtime==0.2.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[project.scripts]
virea-model-remomask-humanml3d-cu128-worker = "virea_remomask.worker:main"

[tool.uv.sources]
virea-model-remomask-humanml3d-runtime = { path = "../runtime", editable = false }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
