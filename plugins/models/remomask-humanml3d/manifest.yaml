notes:
  - The Worker executes the released RVQVAE, four part-level mask/residual transformers, BiMoCo CLIP query encoder/projection, and pinned upstream retrieval database. It never substitutes synthetic motion.
  - The native NPY is inverse-normalized finite float32 [T,263]. HumanML3D recovery remains an explicit downstream adapter step; the 263D vector is not mislabeled as local joint rotations.
  - The fixed HF config declares ViT-B-32.pt with 512-dimensional text input while its fixed best_model.pt contains text_encoder.clip_model.* state. The repository's later AutoModel constructor is incompatible with this release; the runtime follows the immutable config and checkpoint graph exactly and records the compatibility extraction above.
  - integrated_experimental records an implemented locked runtime contract, not completed cross-platform production evidence. Every published installation must still pass the complete production acceptance contract above.
