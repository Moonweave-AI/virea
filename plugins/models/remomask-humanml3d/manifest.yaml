schema_version: virea.model_plugin.v1.0.0
model:
  id: remomask-humanml3d
  display_name: ReMoMask HumanML3D
  plugin_version: 0.1.0
  upstream:
    repository: https://github.com/AIGeeksGroup/ReMoMask
    revision: 630eda1f825bcc2ffb613a7270e1f5b6ac8baea2
    release: ECCV 2026; arXiv v1 2025-08-04
  tasks:
    - text_to_motion
    - retrieval_augmented_text_to_motion
  adapter_family: humanml3d-motion263-body22
  status: runnable_upstream
inputs:
  - schema_version: virea.job_request.v1.0.0
    task: text_to_motion
    fields:
      prompt:
        type: string
        required: true
      motion_length_frames:
        type: integer
        required: false
  - schema_version: virea.job_request.v1.0.0
    task: retrieval_augmented_text_to_motion
    fields:
      prompt:
        type: string
        required: true
      retrieval_database:
        type: remomask_part_motion_database
        required: true
output:
  envelope: virea.model_result.v1.0.0
  representation_id: humanml3d.vector263.v1
  skeleton_id: humanml3d.body22.v1
  fps: 20.0
  coordinate_system: humanml3d.right_handed_y_up_z_forward
  units: meters
  root_translation_semantics: relative_root_facing_xz_velocity_integrated_from_origin_with_absolute_y_height
  root_rotation_semantics: yaw_integrated_from_relative_angular_velocity_with_initial_identity
  face_representation_ids: []
runtime_variants: []
artifacts:
  - id: remomask-models-database-and-clip
    kind: huggingface
    repository: AIGeeksGroup/ReMoMask
    revision: e4b8dd8479e70cbe16015024e0ccbe55d923a7ab
licenses:
  code: CC-BY-NC-SA-4.0
  weights: CC-BY-NC-SA-4.0 per repository-level project license; verify each artifact before redistribution
  dataset_lineage:
    - HumanML3D
    - KIT-ML
    - SnapMoGen
  body_model:
    - Optional SMPL/SMPL-X rendering dependencies retain their own licenses
  commercial_allowed: false
  redistribution_allowed: true
  requires_acceptance: false
  source_urls:
    - https://github.com/AIGeeksGroup/ReMoMask/blob/630eda1f825bcc2ffb613a7270e1f5b6ac8baea2/README.md
    - https://creativecommons.org/licenses/by-nc-sa/4.0/
resources:
  upstream_python: "3.10"
  upstream_pytorch: 2.1.0
  upstream_cuda: "11.8"
  upstream_tested_gpus: [NVIDIA A800, NVIDIA H20]
  upstream_inference_entrypoint: demo.py
  retrieval_components:
    - Part_TMR
    - retrieval_database
    - ViT-B-32.pt
  native_feature_dim: 263
  native_fps: 20.0
notes:
  - The full upstream Git commit and Hugging Face artifact revision were verified with git ls-remote on 2026-08-21.
  - The Hugging Face repository is a multi-component bundle containing generator checkpoints, retrieval checkpoints, database, evaluators, and CLIP weights; downstream component licenses still need per-file review.
  - The shared HumanML3D synthetic output-contract adapter exists, but runnable_upstream is not integrated_experimental or supported; no VIREA Worker, isolated runtime, real upstream checkpoint result, or production end-to-end acceptance exists.
