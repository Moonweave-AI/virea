schema_version: virea.model_plugin.v1.0.0
model:
  id: momadiff-humanml3d
  display_name: MoMADiff HumanML3D
  plugin_version: 0.1.0
  upstream:
    repository: https://github.com/zzysteve/MoMADiff
    revision: 6dd9bea254bbca6cf19756ac3ee037cbf4f6021c
    release: ACM Multimedia 2025
  tasks:
    - text_to_motion
  adapter_family: humanml3d-motion263-body22
  status: integrated_experimental
inputs:
  - schema_version: virea.job_request.v1.0.0
    task: text_to_motion
    fields:
      prompt:
        type: string
        required: true
        maximum_length: 8000
      motion_length_frames:
        type: integer
        required: false
        minimum: 4
        maximum: 196
        multiple_of: 4
        description: Optional explicit HumanML3D pose count; omitted lengths use the released estimator.
output:
  envelope: virea.model_result.v1.0.0
  representation_id: humanml3d.vector263.v1
  skeleton_id: humanml3d.body22.v1
  fps: 20.0
  coordinate_system: humanml3d.right_handed_y_up_z_forward
  units: meters
  root_translation_semantics: relative_root_facing_xz_velocity_integrated_from_origin_with_absolute_y_height
  root_rotation_semantics: yaw_integrated_from_relative_angular_velocity_with_initial_identity
  face_representation_ids: []
runtime_variants:
  - schema_version: virea.runtime_spec.v1.0.0
    id: momadiff-humanml3d-cu128
    backend: uv-native
    platforms:
      - win-64
      - linux-64
    python: ">=3.11,<3.12"
    accelerator:
      kind: nvidia
      abi: cu128
      min_vram_gib: 6.0
    lockfile: uv.lock
    min_storage_gib: 12.0
    resource_profiles:
      - id: cuda-full
        strategy: cuda_full
        min_free_vram_gib: 6.0
        min_free_ram_gib: 8.0
        min_free_swap_gib: 0.0
    entrypoint_argv:
      - python
      - -m
      - virea_momadiff.worker
    startup_timeout_seconds: 600
    environment_allowlist:
      - VIREA_ARTIFACT_ROOTS_JSON
      - VIREA_MEMORY_STRATEGY
      - VIREA_RESOURCE_PROFILE
      - HF_HOME
      - HF_HUB_OFFLINE
      - TRANSFORMERS_OFFLINE
    working_directory: plugins/models/momadiff-humanml3d/runtime-cu128
    project_package: virea-model-momadiff-humanml3d-cu128-runtime
    project_version: 0.1.3
    runtime_core_epoch: virea-runtime-core-20260821.2
    availability: real_checkpoint_production_acceptance_and_memory_floor_calibration_passed_on_win64_rtx5090
