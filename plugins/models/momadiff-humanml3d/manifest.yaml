production_acceptance:
  schema_version: virea.production_e2e_acceptance.v1.0.0
  kind: production_e2e
  request:
    schema_version: virea.job_request.v1.0.0
    model_id: momadiff-humanml3d
    task: text_to_motion
    input:
      prompt: A person walks forward, turns left, and raises the right hand.
      motion_length_frames: 80
    parameters:
      seed: 42
      fps: 20.0
    avatar_id: null
    idempotency_key: null
  expected:
    representation_id: humanml3d.vector263.v1
    skeleton_id: humanml3d.body22.v1
    min_frames: 80
    artifacts:
      - native_motion
      - motion_ir
      - retargeted_motion
      - vrma
  required_stages:
    - environment_detection
    - artifact_installation
    - runtime_build
    - model_load
    - inference
    - native_artifact_validation
    - motion_ir_conversion
    - retarget_validation
    - vrma_export
    - web_playback
  timeout_seconds: 3600.0
notes:
  - "The Worker executes the released notebook path: masked autoregressive latent generation, diffusion token synthesis, KLVAE decoding, then the official HumanML3D mean/std inverse transform."
  - "The native artifact is the post-inverse-transform [T,263] carrier. recover_from_ric joint positions are deliberately not substituted for the native model output."
  - "CUDA full placement and whole-model CPU execution are implemented. No CPU-offload strategy is declared or inferred from spare RAM."
  - "The pinned artifacts passed VIREA environment detection, transactional installation, isolated CUDA runtime load, exact 80-frame inference, Motion IR conversion, retarget validation, VRMA export, and independent real-browser Avatar playback on Windows with an RTX 5090 Laptop GPU. This evidence supports integrated_experimental only and is not a supported or cross-platform claim."
