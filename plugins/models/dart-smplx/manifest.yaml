production_acceptance:
  schema_version: virea.production_e2e_acceptance.v1.0.0
  kind: production_e2e
  request:
    schema_version: virea.job_request.v1.0.0
    model_id: dart-smplx
    task: streaming_text_to_motion
    input:
      text_timeline:
        - {text: "walk forward", primitive_count: 4}
        - {text: "turn left", primitive_count: 2}
    parameters: {seed: 0, guidance_scale: 5.0, fix_floor: false, fps: 30.0}
    avatar_id: null
    idempotency_key: null
  expected:
    representation_id: dart.smplx.body22.axis_angle_primitives.v1
    skeleton_id: smplx.body22.v1
    min_frames: 50
    artifacts: [native_motion, motion_ir, retargeted_motion, vrma]
  required_stages: [environment_detection, artifact_installation, runtime_build, model_load, inference, native_artifact_validation, motion_ir_conversion, retarget_validation, vrma_export, web_playback]
  timeout_seconds: 7200.0
notes:
  - The Worker runs the released DART denoiser, motion-primitive VAE, diffusion sampler, SinglePrimitiveDataset stand seed, SMPL-X regression, world reconstruction, and get_blended_feature overlap path; no synthetic substitute is accepted.
  - It publishes transl, global_orient, body_pose, primitive boundaries, betas, the exact text timeline, and measured boundary-continuity evidence as immutable native artifacts before Motion IR conversion.
  - Windows and macOS use a four-function pure-PyTorch implementation of the public PyTorch3D BSD rotation conventions because official compiled wheels do not cover those systems. Dedicated round-trip tests freeze the convention.
  - The Google Drive bundle and SMPL-X models remain user-supplied manual assets. Exact sentinel files are validated; VIREA neither redistributes SMPL-X nor accepts recursive wildcard placeholders.
  - This manifest integrates DART's released BABEL online/headless text rollout model. In-betweening, waypoint policy control, and scene optimization are application layers with additional request schemas/assets and are not falsely advertised as this Worker's task.
  - integrated_experimental records a complete install/load/infer/convert contract, while READY still requires the selected device to pass every production acceptance stage above.
