[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-dart-smplx-cu128-runtime"
version = "0.2.0"
description = "CUDA 12.8 environment for the DART SMPL-X VIREA Worker"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Moonweave AI" }]
dependencies = [
  "virea-model-dart-smplx-runtime==0.2.0",
  "torch==2.11.0",
]

[project.scripts]
virea-model-dart-smplx-cu128-worker = "virea_dart.worker:main"

[tool.uv.sources]
virea-model-dart-smplx-runtime = { path = "../runtime", editable = false }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
