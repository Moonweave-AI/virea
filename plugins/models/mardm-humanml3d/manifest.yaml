    model_id: mardm-humanml3d
    task: text_to_motion
    input:
      prompt: A person walks forward and waves with the right hand.
    parameters:
      motion_length_frames: 80
      seed: 3407
      time_steps: 18
      cfg: 4.5
      fps: 20.0
    avatar_id: null
    idempotency_key: null
