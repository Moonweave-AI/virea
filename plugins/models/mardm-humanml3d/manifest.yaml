notes:
  - The Worker imports the exact pinned upstream source archive and loads only the three exact checkpoint revisions plus the official OpenAI ViT-B/32 checkpoint; it never downloads during load or inference.
  - The official MARDM constructor asserts CUDA availability only while preparing OpenAI CLIP and converts those weights to fp16. The shared Worker preserves that path for cuda_full and narrowly keeps AE, MARDM, length estimator, and CLIP weights in float32 for whole-model CPU execution; generation mathematics are unchanged.
  - The Worker emits normalized RIC-67 together with the pinned upstream t2m evaluation mean and standard deviation required by the registered adapter. It does not invent the absent per-joint rotation stream.
  - The existing generic CLI seconds parameter is accepted only when it maps exactly to 4-frame MARDM token increments at 20 FPS; callers may instead provide motion_length_frames, but never both.
  - Temporal editing remains an upstream capability but is intentionally not declared by this Worker until its source-motion and edit-interval production path has separate real-checkpoint acceptance evidence.
  - Windows RTX 5090 acceptance for job 01M0H4F7KXDM1BWRC47FCC1Z97 remains historical evidence for shared runtime package 0.2.2. The new 0.2.3 CUDA wrapper and CPU variant have contract/lock evidence only and require separate real-checkpoint acceptance.
