notes:
  - The Worker executes the released RVQ-VAE and MaskTransformer graphs from the pinned commit and four official InterHuman checkpoint files; it never substitutes synthetic motion.
  - Text interaction generation publishes both actors in one finite float32 [2,T,262] native artifact. Reaction generation accepts one finite [T,262] actor carrier and generates the second actor with the upstream generate_reaction path.
  - The shared-frame transform is published separately and required by the adapter, so the two actors remain in one interaction frame throughout Motion IR conversion and source-skeleton preview.
  - The checkpoint bundle remains a manual asset because the upstream Google Drive folder has no immutable object digest or separate weight license. Exact files are required; recursive wildcard acceptance is forbidden.
  - integrated_experimental means the complete runtime and acceptance contract are implemented. A local installation becomes READY only after the selected device executes the real production acceptance stages above.
