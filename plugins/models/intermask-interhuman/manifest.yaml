    id: intermask-interhuman-cu128
    backend: uv-native
    platforms: [win-64, linux-64]
    python: ">=3.11,<3.12"
    accelerator: {kind: nvidia, abi: cu128, min_vram_gib: 8.0}
    lockfile: uv.lock
    min_storage_gib: 10.0
    resource_profiles:
      - {id: cuda-full, strategy: cuda_full, min_free_vram_gib: 8.0, min_free_ram_gib: 12.0, min_free_swap_gib: 0.0}
    entrypoint_argv: [python, -m, virea_intermask.worker]
    startup_timeout_seconds: 600
    environment_allowlist: [VIREA_ARTIFACT_ROOTS_JSON, VIREA_RESOURCE_PROFILE, VIREA_MEMORY_STRATEGY, VIREA_RUNTIME_ID, HF_HOME, HF_HUB_OFFLINE, TRANSFORMERS_OFFLINE, TOKENIZERS_PARALLELISM]
