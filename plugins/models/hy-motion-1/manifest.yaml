    repository: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    allow_patterns:
      - "*.json"
      - "*.safetensors"
      - LICENSE
      - merges.txt
      - vocab.json
    expected_files:
      - config.json
      - model.safetensors.index.json
      - tokenizer.json
  - id: hy-motion-clip-vit-large-patch14
    kind: huggingface
    repository: openai/clip-vit-large-patch14
    revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
    allow_patterns:
      - config.json
      - model.safetensors
      - preprocessor_config.json
      - special_tokens_map.json
      - tokenizer_config.json
      - tokenizer.json
      - merges.txt
      - vocab.json
    expected_files:
      - config.json
      - model.safetensors
      - tokenizer.json
resources:
  model_parameters: 1.0B
  minimum_vram_gib: 26
  low_vram_guidance:
    num_seeds: 1
    prompt_max_words: 30
    duration_max_seconds: 5
  upstream_platforms: [macOS, Windows, Linux]
  upstream_inference_entrypoint: local_infer.py
  internal_motion_tensor_shape: [B, T, 201]
  public_decoded_rotation_shape: [B, T, 22, 6]
  output_mesh_fps: 30.0
  portable_cpu_fallback_minimum_total_ram_gib: 40
  portable_cpu_fallback_minimum_free_swap_gib: 16
  complete_offline_artifact_closure:
    - pinned HY-Motion source and wooden-body assets
    - pinned Standard checkpoint
    - pinned Qwen3-8B text encoder
    - pinned CLIP ViT-L/14 text encoder
licenses:
  code: Tencent HY-Motion 1.0 Community License Agreement
  weights: Tencent HY-Motion 1.0 Community License Agreement
  dataset_lineage:
    - Upstream reports more than 3000 hours of proprietary/diverse pretraining motion and 400 hours of curated fine-tuning motion
  body_model:
    - Bundled WoodenMesh assets
    - Optional SMPL/SMPL-H export dependencies retain their own terms
  commercial_allowed: null
  redistribution_allowed: null
  requires_acceptance: true
  source_urls:
    - https://github.com/Tencent-Hunyuan/HY-Motion-1.0/blob/4e426f5a1021cbcf7f375458c37b840ee7225229/License.txt
    - https://huggingface.co/tencent/HY-Motion-1.0/blob/620dd559f8d964aac2f82f1204fe6a35ad8ad14d/LICENSE.txt
    - https://github.com/Tencent-Hunyuan/HY-Motion-1.0/blob/4e426f5a1021cbcf7f375458c37b840ee7225229/README.md
    - https://huggingface.co/Qwen/Qwen3-8B/tree/b968826d9c46dd6066d109eabc6255188de91218
    - https://huggingface.co/openai/clip-vit-large-patch14/tree/32bd64288804d66eefd0ccbe215aa642df71cc41
production_acceptance:
  schema_version: virea.production_e2e_acceptance.v1.0.0
  kind: production_e2e
  request:
    schema_version: virea.job_request.v1.0.0
    model_id: hy-motion-1
    task: text_to_motion
    input:
      prompt: A person walks forward, turns, and waves with the right hand.
      duration_seconds: 2.0
    parameters:
      seed: 42
      guidance_scale: 5.0
    avatar_id: null
    idempotency_key: null
  expected:
    representation_id: hy_motion.body22.rot6d_translation.v1
    skeleton_id: hy_motion.wooden_body22.v1
    min_frames: 30
    artifacts: [native_motion, motion_ir, retargeted_motion, vrma]
  required_stages:
    - environment_detection
    - artifact_installation
    - runtime_build
    - model_load
    - inference
    - native_artifact_validation
    - motion_ir_conversion
    - retarget_validation
    - vrma_export
    - web_playback
  timeout_seconds: 7200.0
notes:
  - "The optional upstream prompt-engineering service is not exposed as a VIREA input: its separate quantized prompter artifact is not part of the pinned offline closure. Prompts are passed unchanged to the official motion pipeline."
  - The full Git commit and Hugging Face artifact revision were verified with git ls-remote on 2026-08-21.
  - The custom license has territory, acceptable-use, downstream-notice, and large-service conditions; null commercial/redistribution facts intentionally require legal review instead of guessing.
  - At the pinned public decoder, the model tensor is 201D but body output consumes translation 0:3, root rotation 3:9, and 21 body rotations 9:135; features 135:201 are not consumed by _decode_o6dp and must remain opaque.
  - VIREA now installs the complete pinned offline source/checkpoint/Qwen/CLIP closure and executes the official MotionFlowMatching.generate path in an isolated Worker; READY is still granted only after real local acceptance succeeds on the selected device.
  - Native Windows and Linux can select CUDA when total VRAM satisfies the official 26 GiB floor; Windows, Linux, WSL, Intel macOS, and Apple Silicon can select the CPU fallback when host memory admission succeeds.
