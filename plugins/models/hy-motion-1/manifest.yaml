schema_version: virea.model_plugin.v1.0.0
model:
  id: hy-motion-1
  display_name: Tencent HY-Motion 1.0
  plugin_version: 0.2.0
  upstream:
    repository: https://github.com/Tencent-Hunyuan/HY-Motion-1.0
    revision: 4e426f5a1021cbcf7f375458c37b840ee7225229
    release: "2025-12-30"
  tasks:
    - text_to_motion
  adapter_family: hy-motion-body22
  status: integrated_experimental
inputs:
  - schema_version: virea.job_request.v1.0.0
    task: text_to_motion
    fields:
      prompt:
        type: string
        required: true
        recommended_language: English
        recommended_max_words: 60
      duration_seconds:
        type: number
        required: false
      seed:
        type: integer
        required: false
output:
  envelope: virea.model_result.v1.0.0
  representation_id: hy_motion.body22.rot6d_translation.v1
  skeleton_id: hy_motion.wooden_body22.v1
  fps: 30.0
  coordinate_system: hy_motion.right_handed_y_up_ground_aligned
  units: meters
  root_translation_semantics: absolute_world_translation_smoothed_and_shifted_vertically_to_ground_the_decoded_mesh
  root_rotation_semantics: root_6d_rotation_local_to_world_smoothed_by_upstream_slerp_path
  face_representation_ids: []
runtime_variants:
  - schema_version: virea.runtime_spec.v1.0.0
    id: hy-motion-1-cu128
    backend: uv-native
    platforms: [win-64, linux-64]
    python: ">=3.11,<3.12"
    accelerator:
      kind: nvidia
      abi: cu128
      min_vram_gib: 26.0
    lockfile: uv.lock
    min_storage_gib: 52.0
    resource_profiles:
      - id: cuda-full
        strategy: cuda_full
        min_free_vram_gib: 26.0
        min_free_ram_gib: 24.0
        min_free_swap_gib: 0.0
    entrypoint_argv: [python, -m, virea_model_sdk.worker_entrypoint, virea_hy_motion.worker]
    startup_timeout_seconds: 1800
    environment_allowlist:
      - VIREA_ARTIFACT_ROOTS_JSON
      - VIREA_RESOURCE_PROFILE
      - VIREA_MEMORY_STRATEGY
      - VIREA_RUNTIME_ID
      - HF_HOME
      - HF_HUB_OFFLINE
      - TRANSFORMERS_OFFLINE
      - TOKENIZERS_PARALLELISM
    working_directory: plugins/models/hy-motion-1/runtime-cu128
    project_package: virea-model-hy-motion-1-cu128-runtime
    project_version: 0.2.0
    runtime_core_epoch: virea-runtime-core-20260826.1
    availability: pinned_official_worker_build_and_contract_requires_local_real_checkpoint_acceptance
  - schema_version: virea.runtime_spec.v1.0.0
    id: hy-motion-1-cpu
    backend: uv-native
    platforms: [win-64, linux-64, osx-arm64, osx-64]
    python: ">=3.11,<3.12"
    accelerator:
      kind: cpu
      abi: null
      min_vram_gib: null
    lockfile: uv.lock
    min_storage_gib: 48.0
    resource_profiles:
      - id: whole-model-cpu
        strategy: cpu
        min_free_vram_gib: null
        min_free_ram_gib: 40.0
        min_free_swap_gib: 16.0
    entrypoint_argv: [python, -m, virea_model_sdk.worker_entrypoint, virea_hy_motion.worker]
    startup_timeout_seconds: 1800
    environment_allowlist:
      - VIREA_ARTIFACT_ROOTS_JSON
      - VIREA_RESOURCE_PROFILE
      - VIREA_MEMORY_STRATEGY
      - VIREA_RUNTIME_ID
      - HF_HOME
      - HF_HUB_OFFLINE
      - TRANSFORMERS_OFFLINE
      - TOKENIZERS_PARALLELISM
    working_directory: plugins/models/hy-motion-1/runtime-cpu
    project_package: virea-model-hy-motion-1-cpu-runtime
    project_version: 0.2.0
    runtime_core_epoch: virea-runtime-core-20260826.1
    availability: pinned_official_cpu_fallback_build_and_contract_requires_local_real_checkpoint_acceptance
artifacts:
  - id: hy-motion-source
    kind: https
    url: https://github.com/Tencent-Hunyuan/HY-Motion-1.0/archive/4e426f5a1021cbcf7f375458c37b840ee7225229.zip
    revision: 4e426f5a1021cbcf7f375458c37b840ee7225229
    expected_files:
      - source/hymotion/utils/t2m_runtime.py
      - source/hymotion/pipeline/motion_diffusion.py
      - source/stats/Mean.npy
      - source/stats/Std.npy
      - source/scripts/gradio/static/assets/dump_wooden/v_template.bin
    unpack:
      - path: 4e426f5a1021cbcf7f375458c37b840ee7225229.zip
        format: zip
        destination: source
        strip_components: 1
        remove_archive: true
  - id: hy-motion-1-standard
    kind: huggingface
    repository: tencent/HY-Motion-1.0
    revision: 620dd559f8d964aac2f82f1204fe6a35ad8ad14d
    allow_patterns:
      - HY-Motion-1.0/config.yml
      - HY-Motion-1.0/latest.ckpt
      - LICENSE.txt
    expected_files:
      - HY-Motion-1.0/config.yml
      - HY-Motion-1.0/latest.ckpt
