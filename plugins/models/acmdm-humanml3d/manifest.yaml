notes:
  - "The Worker follows the released joint-level ACMDM-S-PS22 evaluation path exactly: linear flow matching with velocity prediction, default Dopri5 ODE sampling, latent inverse normalization, Causal-AE decoding, and XYZ inverse normalization."
  - "The native artifact is finite float32 [T,22,3] absolute global HumanML3D joint positions. Rotations are not invented; the downstream adapter must explicitly derive a target rotation stream from positions."
  - "The released ACMDM constructor asserts CUDA availability only while preparing OpenAI CLIP and converts those weights to fp16. The shared Worker preserves that path for cuda_full and narrowly keeps CLIP/model weights in float32 for whole-model CPU execution; generation and ODE mathematics are unchanged."
  - "The official README leaves its text-to-motion demo marked To be implemented, but releases evaluation code and the two exact pretrained archives used here. The VIREA Worker extracts only that released inference path and performs no dataset/evaluator download."
  - "This plugin covers joint-level ACMDM-S-PS22 only. Prefix autoregression, ControlNet, raw-joint, XL, and mesh variants require separate artifacts, contracts, and production acceptance."
  - "The Win64 / RTX 5090 acceptance and calibration remain historical evidence for runtime package 0.1.3. The new 0.1.4 CUDA wrapper and CPU variant have contract/lock evidence only and require separate real-checkpoint acceptance."
