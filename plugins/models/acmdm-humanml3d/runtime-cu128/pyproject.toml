[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-acmdm-humanml3d-cu128-runtime"
version = "0.1.4"
description = "CUDA 12.8 environment for the shared VIREA ACMDM Worker"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Moonweave AI" }]
dependencies = [
  "virea-model-acmdm-humanml3d-runtime==0.1.4",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[project.scripts]
virea-model-acmdm-humanml3d-cu128-worker = "virea_acmdm.worker:main"

[tool.uv.sources]
virea-model-acmdm-humanml3d-runtime = { path = "../runtime", editable = false }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
