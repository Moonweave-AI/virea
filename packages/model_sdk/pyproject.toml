[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-sdk"
version = "0.4.0"
description = "Versioned VIREA model worker SDK."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "uvicorn>=0.27",
  "virea-contracts>=0.4.0",
]

[tool.uv.sources]
virea-contracts = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
