[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-runtime"
version = "0.4.0"
description = "Isolated runtime backends and local worker supervision for VIREA."
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
  "virea-bootstrap>=0.4.0",
  "virea-contracts>=0.4.0",
  "virea-core>=0.4.0",
]

[tool.uv.sources]
virea-bootstrap = { workspace = true }
virea-contracts = { workspace = true }
virea-core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
