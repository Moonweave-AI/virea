[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-model-pool"
version = "0.4.0"
description = "Model catalog and transactional local installations for VIREA."
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.34",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "virea-contracts>=0.4.0",
  "virea-core>=0.4.0",
  "virea-runtime>=0.4.0",
]

[tool.uv.sources]
virea-contracts = { workspace = true }
virea-core = { workspace = true }
virea-runtime = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
