[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-motion-ir"
version = "0.4.0"
description = "VIREA Motion IR v2 and canonical211 v3 compatibility bridge."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "virea-contracts>=0.4.0",
]

[tool.uv.sources]
virea-contracts = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
