[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virea-cli"
version = "0.4.0"
description = "Unified local CLI for VIREA."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "uvicorn>=0.27",
  "virea>=0.4.0",
  "virea-api>=0.4.0",
  "virea-bootstrap>=0.4.0",
  "virea-contracts>=0.4.0",
  "virea-core>=0.4.0",
  "virea-model-pool>=0.4.0",
]

[project.scripts]
virea = "virea_cli.main:main"

[tool.uv.sources]
virea = { workspace = true }
virea-api = { workspace = true }
virea-bootstrap = { workspace = true }
virea-contracts = { workspace = true }
virea-core = { workspace = true }
virea-model-pool = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
