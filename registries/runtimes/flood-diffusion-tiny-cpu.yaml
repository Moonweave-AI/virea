schema_version: virea.runtime_spec.v1.0.0
id: flood-diffusion-tiny-cpu
backend: uv-native
platforms:
  - win-64
  - linux-64
  - osx-arm64
  - osx-64
python: ">=3.11,<3.12"
accelerator:
  kind: cpu
  abi: null
  min_vram_gib: null
lockfile: uv.lock
min_storage_gib: 12.0
resource_profiles:
  - id: whole-model-cpu
    strategy: cpu
    min_free_vram_gib: null
    min_free_ram_gib: 16.0
    min_free_swap_gib: 0.0
entrypoint_argv:
  - python
  - -m
  - virea_model_sdk.worker_entrypoint
  - virea_flood.worker
startup_timeout_seconds: 900
environment_allowlist:
  - VIREA_MODEL_ROOT
  - VIREA_TEXT_ENCODER_ROOT
  - VIREA_RESOURCE_PROFILE
  - VIREA_MEMORY_STRATEGY
  - VFR_ATTENTION_BACKEND
  - HF_HOME
  - HF_HUB_OFFLINE
  - TRANSFORMERS_OFFLINE
working_directory: plugins/models/flood-diffusion-tiny/runtime-cpu
project_package: virea-model-flood-diffusion-tiny-cpu-runtime
project_version: 0.1.3
runtime_core_epoch: virea-runtime-core-20260826.1
availability: cpu_contract_and_lock_baseline_real_inference_unverified
