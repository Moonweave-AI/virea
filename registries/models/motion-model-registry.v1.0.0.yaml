registry_version: virea.motion_model_registry.v1.0.0
snapshot_date: '2026-08-20'
scope:
  included:
  - 3D human or character motion generation
  - text, speech, audio, music, image, video, sparse-control and multimodal conditioning
  - motion editing, in-betweening, stylization and retarget-aware generation
  - human-human, human-object and human-scene interaction generation
  - hand/sign motion and physics/humanoid behavior generation
  - important adjacent avatar/video systems, clearly marked as non-direct
  excluded_by_default:
  - pure pose estimation or reconstruction with no generative mode
  - pure action recognition or motion understanding
  - datasets and evaluation methods as direct workers
  - video-only systems that expose no stable 3D motion representation
  completeness_statement: Best-effort public research census as of 2026-08-20. It is deliberately broader than the set of
    runnable plugins and must be maintained as a versioned registry.
support_semantics:
  registered: Tracked as a VIREA support target or adjacent dependency.
  implemented: A tested worker, runtime manifest, decoder and end-to-end VRM regression exist.
  warning: Registration never implies implementation, redistributable weights, or a commercially usable license.
adapter_families:
- id: humanml3d_263d_body22
  covers: HumanML3D/KIT-style 22-joint body and 263D feature pipelines
  motion_ir_target: body22 plus reconstructed root trajectory
- id: smpl_smplh_axis_angle
  covers: SMPL/SMPL-H body and optional hand rotations
  motion_ir_target: body plus optional 30-finger track
- id: smplx_whole_body
  covers: SMPL-X body, hands, jaw/face coefficients and shape
  motion_ir_target: whole-body, hands, expressions and provenance tracks
- id: generic_bvh_or_named_skeleton
  covers: BVH/FBX or arbitrary named skeletons
  motion_ir_target: skeleton profile plus local rotations and root transform
- id: joint_positions_fk_ik
  covers: 3D joint positions, sparse keypoints and trajectory-conditioned outputs
  motion_ir_target: position evidence followed by calibrated IK/retarget
- id: rotation6d_named_joints
  covers: 6D rotation outputs such as SuSu-style body and hand tracks
  motion_ir_target: named local rotations plus source-rest calibration
- id: streaming_audio_motion
  covers: causal audio-to-body/hand/face motion chunks
  motion_ir_target: timestamped chunk stream with continuity state
- id: multi_actor_motion
  covers: dyadic, group and variable-cardinality interaction models
  motion_ir_target: multiple actor tracks with shared world/time semantics
- id: human_object_scene
  covers: objects, contacts, scene geometry and affordance-conditioned motion
  motion_ir_target: actor, object, contact and scene tracks
- id: hand_sign
  covers: bimanual hand motion and sign-language generation
  motion_ir_target: finger-complete hands, wrists, upper body and linguistic timing
- id: physics_policy_bridge
  covers: humanoid policies, actions, torques or simulator trajectories
  motion_ir_target: rollout trajectory converted to auditable kinematic motion
- id: adjacent_rendered_avatar
  covers: video/talking-avatar systems without a stable exposed motion tensor
  motion_ir_target: not directly supported; only via an explicit intermediate-motion export
deduplication:
  raw_capability_rows: 562
  dropped_non_model_placeholders:
  - HGM³-CoSpeech
  - Sim-to-Humanoid Motion Policy Bridge
  unique_research_works_or_systems: 519
  rule: A model/system appears once. Multiple tasks, categories and VIREA tracks are stored as arrays. Same-name but genuinely
    distinct papers retain disambiguating suffixes.
