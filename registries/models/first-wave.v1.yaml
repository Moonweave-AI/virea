overlay_version: virea.motion_model_first_wave_overlay.v1.0.0
snapshot_date: '2026-08-26'
status: draft
owner: VIREA maintainers
base_registry:
  path: motion-model-registry.v1.0.0.yaml
  registry_version: virea.motion_model_registry.v1.0.0
purpose: >-
  A sparse evidence and integration-status overlay for the 14 catalog models
  with VIREA integration contracts, plus notable upstream and registration-only
  research records. It does not duplicate the broader base registry.
status_semantics:
  registered: >-
    Tracked as a research work or integration target only. No inference,
    weight, license, or VIREA implementation claim is implied.
  runnable_upstream: >-
    The official upstream provides enough code, artifacts, and documentation
    to execute at least one published inference path. VIREA may already contain
    a managed Runtime, Worker, or adapter, but the current production-acceptance
    contract has not completed and the model is not counted as integrated.
  integrated_experimental: >-
    A VIREA Worker, isolated Runtime, Motion IR decoder, and model-specific
    production-acceptance target are implemented. This status does not claim
    that a current real-checkpoint acceptance record passed; that fact is kept
    separately in virea_evidence.
  supported: >-
    A tested VIREA worker, runtime manifest, decoder, end-to-end VRM regression,
    and explicit license declaration exist.
  blocked: >-
    A concrete upstream, artifact, license, dependency, platform, or resource
    condition prevents a runnable VIREA integration; the entry must name the
    condition and cannot be installed or promoted.
invariants:
  registration_is_not_support: true
  upstream_runnable_is_not_virea_integrated: true
  integrated_experimental_requires_target_acceptance_contract: true
  integration_status_is_not_real_checkpoint_evidence: true
  supported_requires_real_integration_evidence: true
  supported_entries_in_this_snapshot: 0
  integrated_experimental_entries_in_this_snapshot: 14
