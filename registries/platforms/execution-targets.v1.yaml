  models: [flood-diffusion-tiny, momadiff-humanml3d, mardm-humanml3d, acmdm-humanml3d, cmdm-humanml3d, prism-tp2m-1-4b]
  real_inference_verified: false
  scope: RuntimeSpec declarations, reproducible locks, and isolated worker import contracts only
